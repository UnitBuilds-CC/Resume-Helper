name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # npm run build is `vite build && tsc -p tsconfig.server.json`. It exited 1 on main until the
      # rootDir/outDir fix, which is precisely why no CI existed: the gate would have been red forever.
      - name: Build (client bundle, server typecheck, server emit)
        run: npm run build

      - name: Tests
        run: npx vitest run

      - name: Assert the built server actually starts
        run: |
          DATA_DIR="$RUNNER_TEMP/ci-data" node dist/server/index.js &
          server_pid=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/systems >/dev/null; then
              echo "ok: dist/server/index.js served /api/systems"
              kill "$server_pid"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: the built server never answered on :3000"
          kill "$server_pid" 2>/dev/null || true
          exit 1

      - name: No personal data or build artifacts in git
        run: bash scripts/check-no-personal-data.sh

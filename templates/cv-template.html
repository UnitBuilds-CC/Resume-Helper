<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 2cm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1a1a1a; line-height: 1.5; font-size: 10pt; }
  h1 { font-size: 20pt; font-weight: 700; margin-bottom: 2pt; color: #111; }
  h2 { font-size: 11pt; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5pt; color: #333; border-bottom: 1.5px solid #ccc; padding-bottom: 4pt; margin-top: 18pt; margin-bottom: 10pt; }
  h3 { font-size: 10pt; font-weight: 600; color: #222; margin-top: 10pt; margin-bottom: 4pt; }
  .header { margin-bottom: 12pt; }
  .contact { font-size: 9pt; color: #555; margin-top: 4pt; }
  .contact a { color: #2563eb; text-decoration: none; }
  .contact span { margin-right: 12pt; }
  .summary { font-size: 9.5pt; color: #333; margin-top: 8pt; line-height: 1.6; }
  .entry { margin-bottom: 10pt; page-break-inside: avoid; }
  .entry-header { display: flex; justify-content: space-between; align-items: baseline; }
  .entry-meta { font-size: 9pt; color: #666; }
  .entry-detail { font-size: 9pt; color: #444; margin-top: 2pt; }
  .content { margin-top: 8pt; }
  .content p { margin-bottom: 6pt; }
  .content ul { margin-left: 16pt; margin-bottom: 6pt; }
  .content li { margin-bottom: 3pt; }
  .content strong { font-weight: 600; }
  .content a { color: #2563eb; text-decoration: none; }
  .content hr { border: none; border-top: 1px solid #e0e0e0; margin: 12pt 0; }
  .content em { color: #555; font-size: 9pt; }
  .skills-list { display: flex; flex-wrap: wrap; gap: 6pt; margin-top: 4pt; }
  .skill-tag { background: #f0f0f0; padding: 2pt 8pt; border-radius: 3pt; font-size: 8.5pt; color: #333; }
</style>
</head>
<body>
  <div class="header">
    <h1>{{name}}</h1>
    <div class="contact">{{contact}}</div>
    {{#summary}}<div class="summary">{{summary}}</div>{{/summary}}
  </div>
  {{content}}
</body>
</html>
